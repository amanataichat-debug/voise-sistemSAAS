; Voksy AI SIP gateway — module loading.
; Everything autoloads except legacy channel drivers we never use
; (chan_sip would otherwise fight PJSIP for UDP 5060).
[modules]
autoload=yes
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_alsa.so
noload => chan_oss.so
noload => chan_console.so
noload => pbx_dundi.so
