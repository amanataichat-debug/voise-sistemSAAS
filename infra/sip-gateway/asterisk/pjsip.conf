; =============================================================================
; Voksy AI SIP gateway — PJSIP configuration
; Installed by infra/sip-gateway/install.sh (placeholders are substituted).
;
; Two things live here:
;   1. "o-trunk"  — IP-authenticated SIP trunk to the mobile operator O! (NUR Telecom).
;                   No registration, no passwords: trust is by source IP on both sides.
;   2. "test"     — temporary softphone account on UDP 5080 for testing without
;                   the operator. Remove it (and the firewall rule) after go-live.
; =============================================================================

[global]
type=global
user_agent=VoksyAI-SIP-GW
; Identify inbound requests by source IP first (operator), then by username (softphone).
endpoint_identifier_order=ip,username

[system]
type=system
disable_tcp_switch=yes

; ---------------------------------------------------------------------------
; Transports
; ---------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-test]
type=transport
protocol=udp
bind=0.0.0.0:5080

; ---------------------------------------------------------------------------
; Operator O! (NUR Telecom) — IP trunk
;   SIP signalling from 195.216.237.6:5070 and 195.216.237.7:5070
;   RTP media from 195.216.237.6 - .9, ports 10000-65535
; ---------------------------------------------------------------------------
[o-trunk]
type=endpoint
transport=transport-udp
context=from-operator
disallow=all
allow=alaw
allow=ulaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
; Present caller ID both in From and P-Asserted-Identity — operators differ in which one they read.
send_pai=yes
trust_id_outbound=yes
from_domain=__PUBLIC_IP__
language=ru

[o-trunk]
type=aor
; Both operator servers. Outbound calls address a concrete server explicitly
; (PJSIP/o-trunk/sip:NUMBER@HOST:5070), the bridge fails over from .6 to .7.
contact=sip:195.216.237.6:5070
contact=sip:195.216.237.7:5070
; Set to 30 later if the operator answers OPTIONS pings; 0 = do not ping.
qualify_frequency=0

[o-trunk]
type=identify
endpoint=o-trunk
match=195.216.237.6
match=195.216.237.7

; ---------------------------------------------------------------------------
; Temporary softphone test account (UDP 5080)
;   user: test   password: see /etc/voksy-bridge/bridge.env (TEST_SIP_PASSWORD)
; ---------------------------------------------------------------------------
[test]
type=endpoint
transport=transport-test
context=from-test
disallow=all
allow=alaw
allow=ulaw
auth=test
aors=test
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
language=ru

[test]
type=auth
auth_type=userpass
username=test
password=__TEST_PASSWORD__

[test]
type=aor
max_contacts=2
remove_existing=yes
