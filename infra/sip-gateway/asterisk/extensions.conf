; =============================================================================
; Voksy AI SIP gateway — dialplan
;
; Every real call ends up in AudioSocket(): Asterisk streams the call audio
; (PCM16, 8 kHz, mono, 20 ms frames) to the bridge on 127.0.0.1:9092 and plays
; back whatever the bridge sends. The bridge talks to the Voksy backend over
; WebSocket. Asterisk itself knows nothing about assistants.
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
BRIDGE_HTTP=http://127.0.0.1:9091
AUDIOSOCKET=127.0.0.1:9092

; ---------------------------------------------------------------------------
; Inbound from operator O!. ${EXTEN} is the dialled number (DID) as the
; operator sends it; the backend normalises the format.
; ---------------------------------------------------------------------------
[from-operator]
exten => _[+0-9].,1,NoOp(O! inbound did=${EXTEN} from=${CALLERID(num)})
 same => n,Gosub(voksy-inbound,s,1(${EXTEN}))
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Inbound from the temporary softphone account.
;   100          — Asterisk echo test: proves SIP + RTP work without the bridge
;   anything else — treated as a DID, goes to the bridge like an operator call
; ---------------------------------------------------------------------------
[from-test]
exten => 100,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

exten => _[+0-9].,1,NoOp(TEST inbound did=${EXTEN} from=${CALLERID(num)})
 same => n,Gosub(voksy-inbound,s,1(${EXTEN}))
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Shared inbound handling: register the call with the bridge (it returns the
; call UUID), answer, hand the audio to AudioSocket.
; ---------------------------------------------------------------------------
[voksy-inbound]
exten => s,1,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(VOKSY_UUID=${CURL(${BRIDGE_HTTP}/asterisk/inbound?did=${URIENCODE(${ARG1})}&cid=${URIENCODE(${CALLERID(num)})}&channel=${URIENCODE(${CHANNEL})})})
 same => n,GotoIf($["${LEN(${VOKSY_UUID})}" != "36"]?fail)
 same => n,Answer()
 same => n,AudioSocket(${VOKSY_UUID},${AUDIOSOCKET})
 same => n,Return()
 same => n(fail),NoOp(bridge unavailable, reply='${VOKSY_UUID}')
 same => n,Playtones(congestion)
 same => n,Wait(3)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Outbound via operator. The bridge originates the call over AMI with
; VOKSY_UUID set as a channel variable; when the callee answers, the channel
; lands here and the audio goes to the bridge.
; ---------------------------------------------------------------------------
[outbound-answered]
exten => s,1,NoOp(O! outbound answered uuid=${VOKSY_UUID})
 same => n,AudioSocket(${VOKSY_UUID},${AUDIOSOCKET})
 same => n,Hangup()
