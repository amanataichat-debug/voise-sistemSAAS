; Voksy AI SIP gateway — Asterisk Manager Interface (AMI).
; Loopback only. Used by the bridge to originate outbound calls.
[general]
enabled = yes
webenabled = no
bindaddr = 127.0.0.1
port = 5038

[bridge]
secret = __AMI_SECRET__
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = call
write = call,originate
