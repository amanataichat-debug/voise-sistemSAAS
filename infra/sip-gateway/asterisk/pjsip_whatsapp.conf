; =============================================================================
; Voksy AI SIP gateway — WhatsApp Business Calling (Meta Cloud API), SIP mode.
; Installed by install.sh ONLY when WA_SIP_HOST is set in /etc/voksy-bridge/bridge.env
; and the TLS certificate for that host exists. Otherwise install.sh writes an
; empty file, and pjsip.conf's #tryinclude picks up nothing.
;
; Meta sends SIP INVITE over TLS to __WA_SIP_HOST__:5061 for every call a
; WhatsApp user places to our business number. Requirements (Meta docs):
;   * TLS with a valid certificate for the hostname, no client certificates (no mTLS)
;   * media SRTP; we use SDES (number setting srtp_key_exchange_protocol=SDES): no ICE/DTLS
;   * codec Opus 48000/2 (Asterisk transcodes to slin for AudioSocket), DTMF telephone-event
;   * Meta's INVITE carries "X-FB-External-Domain: wa.meta.vc": that is how we
;     identify it. Source IPs are restricted in the Hetzner firewall (TCP 5061).
;   * keep Meta's Record-Route untouched, otherwise Meta never ACKs our 200 OK
; =============================================================================

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/wa-fullchain.pem
priv_key_file=/etc/asterisk/keys/wa-privkey.pem
method=sslv23
; Meta does not present client certificates as a rule: never ask for one.
verify_client=no
require_client_cert=no
verify_server=no
external_signaling_address=__PUBLIC_IP__
external_media_address=__PUBLIC_IP__

; ---------------------------------------------------------------------------
; Inbound WhatsApp calls (user -> business). No digest auth in the first
; version: trust is the header + the firewall allowlist of Meta networks.
; ---------------------------------------------------------------------------
[wa-meta]
type=endpoint
transport=transport-tls
context=from-whatsapp
disallow=all
allow=opus
dtmf_mode=rfc4733
media_encryption=sdes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
media_use_received_transport=yes
language=ru

[wa-meta]
type=identify
endpoint=wa-meta
match_header=X-FB-External-Domain: wa.meta.vc
