<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — VoksiAI</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2a5ce8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" />
  <link rel="stylesheet" href="/static/css/voksiai.css" />
  <script src="/static/js/i18n.js"></script>
  <style>
    /* Вход без каркаса кабинета (03-layouts, D). Цвета и шрифты — токены voksiai.css */
    body {
      margin: 0;
      font-family: var(--vf-font);
      color: var(--vf-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(74, 124, 243, 0.18), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(42, 92, 232, 0.14), transparent 55%),
        #f8fafc;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--vf-surface);
      border: 1px solid var(--vf-border);
      border-radius: var(--vf-r-lg);
      box-shadow: var(--vf-shadow-3);
      padding: 40px 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .brand .mark-img { width: 38px; height: 38px; display: block; }
    .brand .wordmark {
      font-family: var(--vf-font-display);
      font-size: 22.4px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #2a5ce8, #4a7cf3);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-title { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; text-align: center; margin: 0 0 6px; }
    .login-subtitle { text-align: center; color: var(--vf-text-3); font-size: 15px; margin: 0 0 28px; }

    .alert {
      display: none;
      border-radius: var(--vf-r-sm);
      padding: 12px 16px;
      font-size: 14.4px;
      margin-bottom: 20px;
      line-height: 1.45;
    }
    .alert.show { display: block; }
    .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert-warning { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .alert-info { background: var(--vf-accent-soft); color: var(--vf-accent-hover); border: 1px solid rgba(42, 92, 232, 0.2); }
    .alert a { color: inherit; font-weight: 600; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13.5px; color: var(--vf-text-2); }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--vf-border-strong);
      border-radius: var(--vf-r-sm);
      font: inherit;
      font-size: 16px;
      color: var(--vf-text);
      background: var(--vf-surface);
      box-shadow: var(--vf-shadow-1);
      transition: border-color var(--vf-fast), box-shadow var(--vf-fast);
    }
    .form-control::placeholder { color: var(--vf-text-4); }
    .form-control:focus { outline: none; border-color: var(--vf-accent); box-shadow: 0 0 0 3px var(--vf-accent-ring); }

    .password-wrap { position: relative; }
    .password-wrap .form-control { padding-right: 88px; }
    .password-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--vf-text-3); cursor: pointer;
      font: inherit; font-size: 13.5px; padding: 4px 6px; border-radius: 6px;
    }
    .password-toggle:hover { color: var(--vf-accent); }

    .btn-submit {
      width: 100%;
      padding: 15px 16px;
      border: none;
      border-radius: var(--vf-r-sm);
      background: linear-gradient(135deg, #5a8cf0, #2a5ce8);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(42, 92, 232, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: filter var(--vf-fast), transform var(--vf-fast);
    }
    .btn-submit:hover { filter: brightness(1.05); }
    .btn-submit:active { transform: translateY(1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-footer { margin: 24px 0 0; text-align: center; color: var(--vf-text-3); font-size: 15px; }
    .login-footer a { color: var(--vf-accent); text-decoration: none; font-weight: 600; }
    .login-footer a:hover { text-decoration: underline; }

    .login-lang { position: fixed; top: 16px; right: 16px; }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <div class="login-lang" id="login-lang"></div>

  <main class="login-card">
    <a class="brand" href="/" aria-label="VoksiAI">
      <img class="mark-img" src="/static/brand/logo.svg" alt="" width="38" height="38">
      <span class="wordmark">VoksiAI</span>
    </a>

    <h1 class="login-title" data-i18n="login.title">Вход в кабинет</h1>
    <p class="login-subtitle" data-i18n="login.subtitle">Войдите, чтобы управлять голосовыми ассистентами</p>

    <div id="alert" class="alert" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com" data-i18n-ph="login.email_ph" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="password" data-i18n="login.password">Пароль</label>
        <div class="password-wrap">
          <input type="password" id="password" class="form-control" placeholder="••••••••" data-i18n-ph="login.password_ph" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Показать пароль" data-i18n="login.show">Показать</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn" data-i18n="login.submit">Войти</button>
    </form>

    <p class="login-footer">
      <span data-i18n="login.no_account">Нет аккаунта?</span> <a href="/?register=1" data-i18n="login.register">Зарегистрироваться</a>
    </p>
  </main>

  <script>
    (function () {
      var DASHBOARD_URL = '/static/dashboard.html';

      // Если уже авторизованы — сразу в кабинет.
      if (localStorage.getItem('auth_token')) {
        window.location.replace(DASHBOARD_URL);
        return;
      }

      function t(key, def, params) {
        return window.I18N ? window.I18N.t('login.' + key, params, def) : def;
      }

      // Переключатель языка RU | KY
      var langBox = document.getElementById('login-lang');
      if (window.I18N) {
        var sw = document.createElement('div');
        sw.className = 'vf-lang-switch';
        window.I18N.LANGS.forEach(function (l) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = l.toUpperCase();
          if (l === window.I18N.lang) b.className = 'active';
          b.addEventListener('click', function () { window.I18N.setLang(l); });
          sw.appendChild(b);
        });
        langBox.appendChild(sw);
      }

      var form = document.getElementById('login-form');
      var emailInput = document.getElementById('email');
      var passwordInput = document.getElementById('password');
      var submitBtn = document.getElementById('submit-btn');
      var alertBox = document.getElementById('alert');
      var toggleBtn = document.getElementById('toggle-password');

      // Показать причину выхода, если редирект пришёл с ?reason=...
      var params = new URLSearchParams(window.location.search);
      var reason = params.get('reason');
      if (reason === 'expired' || reason === 'session_expired') {
        showAlert('info', esc(t('session_expired', 'Сессия истекла из-за неактивности. Войдите снова, чтобы продолжить.')));
      } else if (reason === 'logout') {
        showAlert('info', esc(t('logged_out', 'Вы вышли из аккаунта.')));
      }

      // Предзаполним email, если был сохранён ранее.
      var lastEmail = localStorage.getItem('last_login_email');
      if (lastEmail) { emailInput.value = lastEmail; }

      (lastEmail ? passwordInput : emailInput).focus();

      toggleBtn.addEventListener('click', function () {
        var isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        toggleBtn.textContent = isHidden ? t('hide', 'Скрыть') : t('show', 'Показать');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideAlert();

        var email = emailInput.value.trim();
        var password = passwordInput.value;

        if (!email || !password) {
          showAlert('error', esc(t('fill_both', 'Введите email и пароль.')));
          return;
        }

        setLoading(true);

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        })
          .then(function (response) {
            return response.json()
              .catch(function () { return {}; })
              .then(function (data) { return { status: response.status, ok: response.ok, data: data }; });
          })
          .then(function (res) {
            if (res.ok && res.data && res.data.token) {
              localStorage.setItem('auth_token', res.data.token);
              localStorage.setItem('last_login_email', email);
              showAlert('info', esc(t('success', 'Успешный вход! Переходим в кабинет…')));
              window.location.replace(DASHBOARD_URL);
              return;
            }

            setLoading(false);
            handleError(res);
          })
          .catch(function () {
            setLoading(false);
            showAlert('error', esc(t('network_error', 'Не удалось связаться с сервером. Проверьте соединение и попробуйте ещё раз.')));
          });
      });

      function handleError(res) {
        var detail = (res.data && (res.data.detail || res.data.message)) || '';
        var text = String(detail).toLowerCase();

        if (res.status === 403 || text.indexOf('not verified') !== -1 || text.indexOf('не подтвержд') !== -1) {
          var link = '<a href="/?verify=' + encodeURIComponent(emailInput.value.trim()) + '">' +
            esc(t('not_verified_link', 'завершите регистрацию')) + '</a>';
          showAlert('warning', esc(t('not_verified', 'Email не подтверждён. Проверьте почту и подтвердите адрес, либо {link}.'))
            .replace('{link}', link));
          return;
        }

        if (res.status === 401 || text.indexOf('invalid') !== -1 || text.indexOf('password') !== -1 || text.indexOf('пароль') !== -1) {
          showAlert('error', esc(t('invalid', 'Неверный email или пароль.')));
          return;
        }

        showAlert('error', esc(detail || t('generic_error', 'Не удалось войти. Попробуйте ещё раз.')));
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.textContent = loading ? t('submitting', 'Входим…') : t('submit', 'Войти');
      }

      function esc(v) {
        return String(v).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function showAlert(type, html) {
        alertBox.className = 'alert show alert-' + type;
        alertBox.innerHTML = html;
      }

      function hideAlert() {
        alertBox.className = 'alert';
        alertBox.innerHTML = '';
      }
    })();
  </script>
</body>
</html>
