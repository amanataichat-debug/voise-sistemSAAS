<!DOCTYPE html>
<!-- /static/agent-knowledge.html — «Знания агента» (ветка 1610-kb-calls).

     Раньше знания и файлы агента жили в двух маленьких модалках на странице
     агента, хотя это одно и то же: один и тот же файл и отправляют клиенту, и
     используют как источник ответов. Здесь они на одном большом экране —
     пять разделов, каталог плитками с фотографиями, у каждого файла две роли.

     НЕТ ОБЩЕГО САЙДБАРА КАБИНЕТА (ветка 1610-kb-calls, по итогам живого теста
     владельца). Знания принадлежат конкретному агенту обзвона — платной,
     отдельной функции (`User.has_agent_access`), а не кабинету вообще.
     Страница agent.html НАМЕРЕННО не использует общий `<aside class="sidebar">`
     и его пункты «Дашборд / CRM / Настройки» — у неё свой самостоятельный
     топбар (логотип + переключатель агента + «Выйти»), без единой ссылки на
     общий кабинет. Эта страница показывала ровно такой же сайдбар, как у
     всех «базовых» разделов — владелец на живом тесте справедливо указал,
     что это выглядит как шаг назад в общий кабинет, а не продолжение работы
     с агентом. Теперь здесь тот же приём: лёгкий топбар, логотип ведёт на
     /static/agent.html (не на /static/dashboard.html), никакого общего меню.

     Вёрстка — дизайн-система VoksiAI (design-system/04-pages-cabinet.md):
     <body class="vf">, voksiai.css, иконки из /static/icons/ui.svg.
     Логика — /static/js/agent-knowledge.js. -->
<html lang="ru" data-vf-loader>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Знания агента | VoksiAI</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2a5ce8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
  <link rel="stylesheet" href="/static/css/voksiai.css">
  <script defer src="/static/js/i18n.js"></script>
  <script defer src="/static/js/ui.js"></script>
  <style>
    /* ---------- Полоса «что агент знает наизусть» ---------- */
    .brain { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: stretch; margin-bottom: 18px; }
    @media (max-width: 1000px) { .brain { grid-template-columns: minmax(0, 1fr); } }
    .brain-card { padding: 16px 18px; }
    .brain-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .brain-title .ic { width: 17px; height: 17px; color: var(--vf-accent); }
    .brain-sub { font-size: 12.5px; color: var(--vf-text-3); line-height: 1.45; }
    .brain-bar { height: 8px; border-radius: 999px; background: var(--vf-surface-2); overflow: hidden; display: flex; margin: 14px 0 10px; }
    .brain-seg { height: 100%; }
    .brain-seg.company { background: #2a5ce8; }
    .brain-seg.knowledge { background: #10b981; }
    .brain-seg.price { background: #f59e0b; }
    .brain-seg.files { background: #8b5cf6; }
    .brain-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--vf-text-3); }
    .brain-legend b { color: var(--vf-text-1); font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }

    /* ---------- «Спросить как клиент» ---------- */
    .ask-row { display: flex; gap: 8px; }
    .ask-row input { flex: 1; min-width: 0; }
    .ask-out { margin-top: 12px; font-size: 12.5px; line-height: 1.5; }
    .ask-verdict { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; }
    .ask-verdict.fast { background: color-mix(in srgb, #10b981 12%, transparent); color: #047857; }
    .ask-verdict.search { background: color-mix(in srgb, #f59e0b 14%, transparent); color: #92400e; }
    .ask-verdict.none { background: color-mix(in srgb, #ef4444 12%, transparent); color: #b91c1c; }
    .ask-verdict .ic { flex: none; width: 16px; height: 16px; margin-top: 1px; }
    .ask-hit { padding: 7px 10px; border-radius: 8px; background: var(--vf-surface-2); margin-top: 6px; }
    .ask-hit b { font-weight: 600; }

    /* ---------- Разделы ---------- */
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--vf-border); margin-bottom: 16px; }
    .tab { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border: none; background: none; cursor: pointer;
      font: inherit; font-size: 13.5px; font-weight: 500; color: var(--vf-text-3); border-bottom: 2px solid transparent;
      margin-bottom: -1px; border-radius: 8px 8px 0 0; transition: color var(--vf-fast), background var(--vf-fast); }
    .tab:hover { background: var(--vf-surface-2); color: var(--vf-text-1); }
    .tab.on { color: var(--vf-accent); border-bottom-color: var(--vf-accent); font-weight: 600; }
    .tab .ic { width: 16px; height: 16px; }
    .tab .n { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--vf-surface-2); color: var(--vf-text-3); }
    .tab.on .n { background: var(--vf-accent-soft); color: var(--vf-accent); }

    .sec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .sec-hint { font-size: 12.5px; color: var(--vf-text-3); line-height: 1.5; max-width: 760px; }
    .sec-actions { display: flex; gap: 8px; flex: none; }

    /* ---------- Список записей (вопрос-ответ, о компании) ---------- */
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row-card { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--vf-border);
      border-radius: var(--vf-r-md); background: var(--vf-surface-1); transition: border-color var(--vf-fast), box-shadow var(--vf-fast); }
    .row-card:hover { border-color: color-mix(in srgb, var(--vf-accent) 35%, var(--vf-border)); }
    .row-card.off { opacity: .55; }
    .row-main { min-width: 0; flex: 1; cursor: pointer; }
    .row-title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row-sub { font-size: 12.5px; color: var(--vf-text-3); margin-top: 3px; line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row-acts { display: flex; gap: 6px; flex: none; }

    .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--vf-surface-2); color: var(--vf-text-3); }
    .tag-fast { background: color-mix(in srgb, #10b981 15%, transparent); color: #047857; }
    .tag-search { background: color-mix(in srgb, #f59e0b 18%, transparent); color: #92400e; }
    .tag-off { background: color-mix(in srgb, #ef4444 12%, transparent); color: #b91c1c; }
    .tag-hits { background: var(--vf-accent-soft); color: var(--vf-accent); }

    /* ---------- Каталог плитками ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .p-card { border: 1px solid var(--vf-border); border-radius: var(--vf-r-md); background: var(--vf-surface-1);
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
      transition: border-color var(--vf-fast), box-shadow var(--vf-fast), transform var(--vf-fast); }
    .p-card:hover { border-color: color-mix(in srgb, var(--vf-accent) 40%, var(--vf-border)); box-shadow: var(--vf-shadow-2); transform: translateY(-2px); }
    .p-card.off { opacity: .6; }
    .p-photo { aspect-ratio: 4 / 3; background: var(--vf-surface-2); position: relative; display: flex; align-items: center; justify-content: center; }
    .p-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p-photo .ic { width: 30px; height: 30px; color: var(--vf-text-4); }
    .p-more { position: absolute; right: 8px; bottom: 8px; font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 999px; background: rgba(15, 23, 42, .72); color: #fff; backdrop-filter: blur(4px); }
    .p-stock { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 999px; background: rgba(185, 28, 28, .92); color: #fff; }
    .p-body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .p-name { font-weight: 600; font-size: 13.5px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .p-price { font-family: "Syne", sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -.02em; color: var(--vf-text-1); }
    .p-price small { font-family: inherit; font-size: 12px; font-weight: 600; color: var(--vf-text-3); letter-spacing: 0; }
    .p-attrs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
    .p-attr { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--vf-surface-2); color: var(--vf-text-2); }

    /* ---------- Файлы ---------- */
    .f-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center;
      padding: 10px 14px; border: 1px solid var(--vf-border); border-radius: var(--vf-r-md); background: var(--vf-surface-1); }
    .f-thumb { width: 54px; height: 54px; border-radius: 10px; background: var(--vf-surface-2); overflow: hidden;
      display: flex; align-items: center; justify-content: center; }
    .f-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .f-thumb .ic { width: 20px; height: 20px; color: var(--vf-text-4); }
    .f-name { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .f-meta { font-size: 12px; color: var(--vf-text-3); margin-top: 2px; }
    .f-roles { display: flex; flex-direction: column; gap: 6px; flex: none; min-width: 230px; }
    @media (max-width: 760px) {
      .f-row { grid-template-columns: 54px minmax(0, 1fr); }
      .f-roles { grid-column: 1 / -1; min-width: 0; }
    }
    .role { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--vf-text-2); cursor: pointer; }
    .role input { margin: 0; flex: none; }
    .role.disabled { opacity: .5; cursor: default; }
    .f-acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }

    /* ---------- Пробелы базы ---------- */
    .gap-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 14px; border: 1px solid var(--vf-border); border-radius: var(--vf-r-md); background: var(--vf-surface-1); }
    .gap-q { font-weight: 500; font-size: 13.5px; }
    .gap-meta { font-size: 12px; color: var(--vf-text-3); margin-top: 2px; }

    /* ---------- Редактор записи ---------- */
    .ed-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .media-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .media-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; cursor: pointer;
      border: 2px solid transparent; background: var(--vf-surface-2); display: flex; align-items: center; justify-content: center; }
    .media-item img { width: 100%; height: 100%; object-fit: cover; }
    .media-item .ic { width: 20px; height: 20px; color: var(--vf-text-4); }
    .media-item.on { border-color: var(--vf-accent); }
    .media-item .chk { position: absolute; right: 4px; top: 4px; width: 18px; height: 18px; border-radius: 50%;
      background: var(--vf-accent); color: #fff; display: none; align-items: center; justify-content: center; }
    .media-item .chk .ic { width: 12px; height: 12px; color: #fff; }
    .media-item.on .chk { display: flex; }
    .media-item .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; padding: 3px 5px;
      background: rgba(15, 23, 42, .66); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .attr-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 34px; gap: 8px; margin-bottom: 8px; }

    .empty-box { text-align: center; padding: 46px 20px; color: var(--vf-text-3); }
    .empty-box .ic { width: 34px; height: 34px; color: var(--vf-text-4); margin-bottom: 10px; }
    .empty-box h3 { font-size: 15px; color: var(--vf-text-1); margin-bottom: 6px; }
    .empty-box p { font-size: 13px; line-height: 1.5; max-width: 460px; margin: 0 auto 16px; }

    /* ---------- Своя оболочка без общего сайдбара кабинета ----------
       Страница принадлежит агенту обзвона (см. комментарий в начале файла),
       поэтому .vf-main здесь на всю ширину (voksiai.css обычно резервирует
       под <aside class="sidebar"> margin-left: var(--vf-sidebar-w)), а
       топбар несёт свой логотип вместо общего меню Дашборд/CRM/Настройки. */
    .akb-main { margin-left: 0; }
    .akb-logo { display: flex; align-items: center; gap: 8px; flex: none; text-decoration: none; color: inherit; }
    .akb-logo .wordmark { font-family: "Syne", sans-serif; font-weight: 700; font-size: 15px; color: var(--vf-text-1); }
    .akb-logo:hover .wordmark { color: var(--vf-accent); }
    .akb-sep { width: 1px; height: 20px; background: var(--vf-border); flex: none; }
    .akb-topbar h1 { font-size: 16px; }
    @media (max-width: 640px) { .akb-sep, .akb-logo .wordmark { display: none; } }
  </style>
</head>
<body class="vf">
<div class="vf-app akb-app">
  <main class="vf-main akb-main">
    <header class="vf-topbar akb-topbar">
      <div class="vf-topbar-left">
        <a href="/static/agent.html" class="akb-logo" title="К агенту">
          <img class="mark-img" src="/static/brand/logo.svg" alt="" width="26" height="26">
          <span class="wordmark">VoksiAI</span>
        </a>
        <span class="akb-sep"></span>
        <h1 data-i18n="akb.page_title">Знания агента</h1>
        <span id="agent-pick"></span>
      </div>
      <div class="vf-topbar-right">
        <a class="btn btn-ghost" id="btn-to-agent" href="/static/agent.html">
          <svg class="ic"><use href="/static/icons/ui.svg#i-arrow-left"></use></svg><span class="btn-text" data-i18n="akb.to_agent">К агенту</span>
        </a>
        <button class="btn btn-primary" id="btn-add" type="button">
          <svg class="ic"><use href="/static/icons/ui.svg#i-plus"></use></svg><span class="btn-text" data-i18n="akb.add">Добавить</span>
        </button>
        <a href="/" data-logout class="btn btn-ghost btn-icon" id="logout-button" title="Выйти" data-i18n-title="sidebar.logout">
          <svg class="ic"><use href="/static/icons/ui.svg#i-log-out"></use></svg>
        </a>
      </div>
    </header>

    <div class="vf-content">
      <div id="page-note"></div>

      <!-- Что агент знает наизусть + проверка «как клиент» -->
      <div class="brain" id="brain">
        <section class="card brain-card" id="brain-stats"></section>
        <section class="card brain-card">
          <div class="brain-title">
            <svg class="ic"><use href="/static/icons/ui.svg#i-message-circle"></use></svg>
            <span data-i18n="akb.ask_title">Спросить как клиент</span>
          </div>
          <div class="brain-sub" data-i18n="akb.ask_sub">Введите вопрос так, как спросит клиент — покажу, ответит агент мгновенно или пойдёт в поиск.</div>
          <div class="ask-row" style="margin-top:12px">
            <input class="input" id="ask-input" type="text" placeholder="Например: а рассрочка есть?" data-i18n-placeholder="akb.ask_ph">
            <button class="btn btn-secondary" id="ask-btn" type="button">
              <svg class="ic"><use href="/static/icons/ui.svg#i-search"></use></svg>
            </button>
          </div>
          <div class="ask-out" id="ask-out"></div>
        </section>
      </div>

      <!-- Разделы -->
      <div class="tabs" id="tabs"></div>
      <div id="sec"></div>
    </div>
  </main>
</div>

<!-- Редактор записи -->
<div class="vf-backdrop" id="ed-modal">
  <div class="vf-dialog" role="dialog" aria-modal="true" style="max-width:720px">
    <div class="vf-dialog-head">
      <h2 id="ed-title">Запись</h2>
      <button class="btn btn-ghost btn-icon btn-sm" data-close type="button" aria-label="Закрыть">
        <svg class="ic"><use href="/static/icons/ui.svg#i-x"></use></svg>
      </button>
    </div>
    <div class="vf-dialog-body" id="ed-body"></div>
    <div class="vf-dialog-foot">
      <button class="btn btn-ghost" data-close type="button" data-i18n="common.cancel">Отмена</button>
      <button class="btn btn-primary" id="ed-save" type="button">
        <svg class="ic"><use href="/static/icons/ui.svg#i-check"></use></svg><span data-i18n="common.save">Сохранить</span>
      </button>
    </div>
  </div>
</div>

<script defer src="/static/js/agent-knowledge.js"></script>
</body>
</html>
