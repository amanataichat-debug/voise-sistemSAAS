<script>
(function(){ try{
  var t = localStorage.getItem('vs_theme') || 'system';
  var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark){ document.documentElement.setAttribute('data-theme','dark'); document.documentElement.style.backgroundColor='#0a0f1b'; document.documentElement.style.colorScheme='dark'; }
}catch(e){} })();
</script>
<style>html[data-theme="dark"]{background-color:#0a0f1b;color-scheme:dark}</style>
